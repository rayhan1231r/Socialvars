name: Build SocialVerse Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install web dependencies & verify tests
        run: |
          npm ci
          npx tsx --test src/utils/socialverse.test.ts
          npm run build

      - name: Bundle exact web preview UI into Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK & Build Tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android Debug APK
        run: |
          if [ -x android/gradlew ]; then
            (cd android && ./gradlew assembleDebug --no-daemon)
          else
            gradle -p android assembleDebug --no-daemon
          fi

      - name: Package & verify APK
        run: |
          mkdir -p .build-outputs APK_DOWNLOAD
          cp -f android/app/build/outputs/apk/debug/app-debug.apk .build-outputs/app-debug.apk
          cp -f android/app/build/outputs/apk/debug/app-debug.apk APK_DOWNLOAD/app-debug.apk
          SIZE_BYTES=$(stat -c '%s' APK_DOWNLOAD/app-debug.apk)
          echo "Generated APK size: ${SIZE_BYTES} bytes"
          test "$SIZE_BYTES" -gt 1048576
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify -v APK_DOWNLOAD/app-debug.apk

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialVerse-app-debug-apk
          path: APK_DOWNLOAD/app-debug.apk
          if-no-files-found: error
