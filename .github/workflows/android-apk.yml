name: Build SocialVerse Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies & verify tests
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --no-audit --no-fund
          else
            npm install --legacy-peer-deps --no-audit --no-fund
          fi
          npx tsx --test src/utils/socialverse.test.ts
          npm run lint
          npm run build

      - name: Bundle exact web preview UI into Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -r dist/* android/app/src/main/assets/www/
          if [ ! -f android/app/google-services.json ] && [ -f public/assets/aistudio/google-services_e750e594.json ]; then
            cp public/assets/aistudio/google-services_e750e594.json android/app/google-services.json
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android 35 SDK & Build Tools
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"

          SDKMANAGER=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "${SDK_DIR}/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ${SDK_DIR}"
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "${SDK_DIR}/platform-tools" >> "$GITHUB_PATH"

          { yes || true; } | "$SDKMANAGER" --sdk_root="${SDK_DIR}" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="${SDK_DIR}" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android Debug APK
        run: |
          if [ -x android/gradlew ]; then
            (cd android && ./gradlew assembleDebug --no-daemon)
          else
            gradle -p android assembleDebug --no-daemon
          fi

      - name: Package & verify APK
        run: |
          mkdir -p .build-outputs APK_DOWNLOAD
          cp -f android/app/build/outputs/apk/debug/app-debug.apk .build-outputs/app-debug.apk
          cp -f android/app/build/outputs/apk/debug/app-debug.apk APK_DOWNLOAD/app-debug.apk
          SIZE_BYTES=$(stat -c '%s' APK_DOWNLOAD/app-debug.apk)
          echo "Generated APK size: ${SIZE_BYTES} bytes"
          test "$SIZE_BYTES" -gt 1048576
          SDK_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          "${SDK_DIR}/build-tools/35.0.0/apksigner" verify -v APK_DOWNLOAD/app-debug.apk

      - name: Upload app-debug.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: SocialVerse-app-debug-apk
          path: APK_DOWNLOAD/app-debug.apk
          if-no-files-found: error
